[package]
name = "prismwing"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fail-closed local runtime research tools for Xiaomi MiMo-V2.5"

[dependencies]
memmap2 = "0.9.8"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
